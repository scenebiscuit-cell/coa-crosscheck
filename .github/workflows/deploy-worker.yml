name: Deploy Pharos AI Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "build_demo.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build worker
        run: python build_demo.py
      - name: Create or reuse KV namespace
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          from urllib.request import Request, urlopen

          token = os.environ["CLOUDFLARE_API_TOKEN"]
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          base = f"https://api.cloudflare.com/client/v4/accounts/{account}/storage/kv/namespaces"

          def call(url, method="GET", data=None):
              request = Request(url, data=data, method=method, headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json",
              })
              with urlopen(request) as response:
                  result = json.load(response)
              if not result.get("success"):
                  raise RuntimeError("Cloudflare KV namespace request failed")
              return result["result"]

          namespaces = call(base + "?per_page=1000")
          namespace = next((item for item in namespaces if item["title"] == "coa-crosscheck-limits"), None)
          if namespace is None:
              subprocess.run(
                  ["npx", "--yes", "wrangler", "kv", "namespace", "create", "coa-crosscheck-limits"],
                  check=True,
              )
              namespaces = call(base + "?per_page=1000")
              namespace = next((item for item in namespaces if item["title"] == "coa-crosscheck-limits"), None)
          if namespace is None:
              raise RuntimeError("Wrangler did not create the LIMITS namespace")
          config = Path("wrangler.toml")
          content = config.read_text()
          content = content.replace('id = "managed-by-deploy-workflow"', f'id = "{namespace["id"]}"')
          config.write_text(content)
          PY
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
      - name: Find worker URL
        id: worker-url
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          request = Request(
              f"https://api.cloudflare.com/client/v4/accounts/{account}/workers/subdomain",
              headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"]},
          )
          with urlopen(request) as response:
              payload = json.load(response)
          subdomain = payload["result"]["subdomain"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"url=https://pharos-ai-worker.{subdomain}.workers.dev\n")
      - name: Commit hosted demo URL
        env:
          CLOUD_URL: ${{ steps.worker-url.outputs.url }}
        run: |
          python build_demo.py --cloud-url "$CLOUD_URL"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add worker/wrangler.toml
          if ! git diff --cached --quiet; then
            git commit -m "Enable hosted AI answers"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
